apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecm516-20262-observacoes-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: observacoes
  template:
    metadata:
      labels:
        app: observacoes
    spec:
      containers:
        - name: ecm516-20262-observacoes
          image: leoolivieri/ecm516-20262-observacoes:2.0.0
          ports:
            - containerPort: 5001
          env:
            - name: URL_LEMBRETES
              value: "http://localhost:30000"
            - name: URL_OBSERVACOES
              value: "http://localhost:30001"
            - name: URL_CONSULTA
              value: "http://localhost:30002"
          resources:
            requests:
              memory: 128Mi
              cpu: 250m
            limits:
              memory: 256Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: ecm516-20262-observacoes-clusterip-service
spec:
  type: ClusterIP
  selector:
    app: observacoes
  ports:
    - name: observacoes
      protocol: TCP
      port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: ecm516-20262-observacoes-nodeport-service
spec:
  type: NodePort
  selector:
    app: observacoes
  ports:
    - name: observacoes
      protocol: TCP
      port: 5001
      targetPort: 5001
      nodePort: 30001
